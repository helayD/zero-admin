Name: job-api
Host: 0.0.0.0
Port: 8089

Mysql:
  Datasource: root:12341qweqfsd2356@tcp(127.0.0.1:3306)/gozero?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

AntChain:
  Endpoint: ""
  ReceiptEndpoint: ""
  AppId: ""
  AccessKey: ""
  Secret: ""
  TimeoutSeconds: 10
  Enabled: false

Blockchain:
  Primary: fisco

# Story 10.11: FISCO BCOS 3.x 真实上链配置。
Fisco:
  Enabled: false
  Host: ""
  Port: 0
  DisableSsl: false
  IsSMCrypto: false
  GroupID: "group0"
  ChainID: "chain0"
  ContractAddr: ""
  ContractABI: ""
  ContractABIPath: "/opt/fisco/contracts/CardToken.abi"
  PrivateKey: ""
  CaCertPath: "/opt/fisco/sdk/ca.crt"
  SdkCertPath: "/opt/fisco/sdk/sdk.crt"
  SdkKeyPath: "/opt/fisco/sdk/sdk.key"
  TimeoutSeconds: 30        # SDK 内部已同步轮询 receipt；本字段仅整体超时保护

UmsRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: ums.rpc
  NonBlock: true
