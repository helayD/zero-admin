message QueryRoleMenuListResp {
  repeated MenuData list = 1;
  repeated int64 MenuIds = 2;
}

message UpdateRoleMenuReq {
  int64 roleId = 1;
  repeated int64 menuIds = 2;
}

message UpdateRoleMenuResp {
  string pong = 1;
}

message QueryRoleUserListReq {
