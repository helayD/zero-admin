syntax = "proto3";

package main;

option go_package = "./proto";

// 添加菜单模板
message AddMenuTemplateReq {
  string name = 1; //模板名称
  string scope_type = 2; //适用作用域类型（tenant:租户级 merchant:商户级）
  int64 platform_id = 3; //平台ID
  int32 status = 4; //状态(1:正常，0:禁用)
  string remark = 5; //备注
  string create_by = 6; //创建者
  repeated int64 menu_ids = 7; //菜单ID列表
}

message AddMenuTemplateResp {
  string pong = 1;
}

// 删除菜单模板
message DeleteMenuTemplateReq {
  repeated int64 ids = 1;
}

message DeleteMenuTemplateResp {
  string pong = 1;
}

// 更新菜单模板
message UpdateMenuTemplateReq {
  int64 id = 1; //模板id
  string name = 2; //模板名称
  string scope_type = 3; //适用作用域类型
  int64 platform_id = 4; //平台ID
  int32 status = 5; //状态(1:正常，0:禁用)
  string remark = 6; //备注
  string update_by = 7; //更新者
  repeated int64 menu_ids = 8; //菜单ID列表
}

message UpdateMenuTemplateResp {
  string pong = 1;
}

// 查询菜单模板详情
message QueryMenuTemplateDetailReq {
  int64 id = 1;
}

message QueryMenuTemplateDetailResp {
  int64 id = 1; //模板id
  string name = 2; //模板名称
  string scope_type = 3; //适用作用域类型
  int64 platform_id = 4; //平台ID
  int32 status = 5; //状态
  string remark = 6; //备注
  string create_by = 7; //创建者
  string create_time = 8; //创建时间
  string update_by = 9; //更新者
  string update_time = 10; //更新时间
  repeated int64 menu_ids = 11; //关联菜单ID列表
}

// 分页查询菜单模板列表
message QueryMenuTemplateListReq {
  int64 page_num = 1; //第几页
  int64 page_size = 2; //每页的数量
  string name = 3; //模板名称
  string scope_type = 4; //适用作用域类型过滤
  int32 status = 5; //状态过滤
}

message MenuTemplateListData {
  int64 id = 1; //模板id
  string name = 2; //模板名称
  string scope_type = 3; //适用作用域类型
  int64 platform_id = 4; //平台ID
  int32 status = 5; //状态
  string remark = 6; //备注
  string create_by = 7; //创建者
  string create_time = 8; //创建时间
  string update_by = 9; //更新者
  string update_time = 10; //更新时间
  int32 menu_count = 11; //关联菜单数量
}

message QueryMenuTemplateListResp {
  int64 total = 1;
  repeated MenuTemplateListData list = 2;
}

// 根据作用域类型查询可用菜单模板（用于角色分配菜单时获取模板限制范围）
message QueryMenuTemplateByScope {
  string scope_type = 1; //作用域类型
  int64 platform_id = 2; //平台ID
}

message QueryMenuTemplateByScopeResp {
  repeated int64 menu_ids = 1; //该作用域下所有模板允许的菜单ID并集
}

// 菜单模板服务
service MenuTemplateService {
  // 添加菜单模板
  rpc AddMenuTemplate(AddMenuTemplateReq) returns (AddMenuTemplateResp){}
  // 删除菜单模板
  rpc DeleteMenuTemplate(DeleteMenuTemplateReq) returns (DeleteMenuTemplateResp){}
  // 更新菜单模板
  rpc UpdateMenuTemplate(UpdateMenuTemplateReq) returns (UpdateMenuTemplateResp){}
  // 查询菜单模板详情
  rpc QueryMenuTemplateDetail(QueryMenuTemplateDetailReq) returns (QueryMenuTemplateDetailResp){}
  // 查询菜单模板列表
  rpc QueryMenuTemplateList(QueryMenuTemplateListReq) returns (QueryMenuTemplateListResp){}
  // 根据作用域查询可用菜单ID
  rpc QueryMenuIdsByScope(QueryMenuTemplateByScope) returns (QueryMenuTemplateByScopeResp){}
}
