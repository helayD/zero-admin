syntax = "proto3";

package main;

option go_package = "./proto";

message AddProductCategoryReq {
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  int32 level = 4;
  string product_unit = 6;
  int32 nav_status = 7;
  int32 sort = 8;
  string icon = 9;
  string keywords = 10;
  string description = 11;
  int32 is_enabled = 12;
  int64 create_by = 13;
  repeated int64 product_attribute_id_list = 14;
  GovernanceScope scope = 15;
}
message AddProductCategoryResp { string pong = 1; }
message DeleteProductCategoryReq { repeated int64 ids = 1; int64 update_by = 2; GovernanceScope scope = 3; }
message DeleteProductCategoryResp { string pong = 1; }
message UpdateProductCategoryReq {
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  int32 level = 4;
  string product_unit = 6;
  int32 nav_status = 7;
  int32 sort = 8;
  string icon = 9;
  string keywords = 10;
  string description = 11;
  int32 is_enabled = 12;
  int64 update_by = 13;
  repeated int64 product_attribute_id_list = 14;
  GovernanceScope scope = 15;
}
message UpdateProductCategoryResp { string pong = 1; }
message UpdateProductCategoryStatusReq { repeated int64 ids = 1; int32 status = 2; int64 update_by = 3; GovernanceScope scope = 4; }
message UpdateProductCategoryStatusResp { string pong = 1; }
message QueryProductCategoryDetailReq { int64 id = 1; GovernanceScope scope = 2; }
message QueryProductCategoryDetailResp {
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  int32 level = 4;
  int32 product_count = 5;
  string product_unit = 6;
  int32 nav_status = 7;
  int32 sort = 8;
  string icon = 9;
  string keywords = 10;
  string description = 11;
  int32 is_enabled = 12;
  int64 create_by = 13;
  string create_time = 14;
  int64 update_by = 15;
  string update_time = 16;
  string scope_type = 17;
  int64 platform_id = 18;
  int64 tenant_id = 19;
  int64 merchant_id = 20;
}
message QueryProductCategoryListReq { string name = 1; int32 nav_status = 2; string keywords = 3; int32 is_enabled = 4; int32 page_num = 5; int32 page_size = 6; int64 parent_id = 7; GovernanceScope scope = 8; }
message ProductCategoryListData {
  int64 id = 1;
  int64 parent_id = 2;
  string name = 3;
  int32 level = 4;
  int32 product_count = 5;
  string product_unit = 6;
  int32 nav_status = 7;
  int32 sort = 8;
  string icon = 9;
  string keywords = 10;
  string description = 11;
  int32 is_enabled = 12;
  int64 create_by = 13;
  string create_time = 14;
  int64 update_by = 15;
  string update_time = 16;
  string scope_type = 17;
  int64 platform_id = 18;
  int64 tenant_id = 19;
  int64 merchant_id = 20;
}
message QueryProductCategoryListResp { int64 total = 1; repeated ProductCategoryListData list = 2; }
message QueryProductCategoryTreeListReq { GovernanceScope scope = 1; }
message QueryProductCategoryListTreeData{ int64 id = 1; string name = 2; string image_url = 3; repeated QueryProductCategoryListTreeData children = 4; }
message QueryProductCategoryListTreeResp { repeated QueryProductCategoryListTreeData list = 1; }
service ProductCategoryService {
  rpc AddProductCategory(AddProductCategoryReq) returns (AddProductCategoryResp){}
  rpc DeleteProductCategory(DeleteProductCategoryReq) returns (DeleteProductCategoryResp){}
  rpc UpdateProductCategory(UpdateProductCategoryReq) returns (UpdateProductCategoryResp ){}
  rpc UpdateCategoryNavStatus(UpdateProductCategoryStatusReq) returns(UpdateProductCategoryStatusResp);
  rpc UpdateProductCategoryStatus(UpdateProductCategoryStatusReq) returns(UpdateProductCategoryStatusResp);
  rpc QueryProductCategoryDetail(QueryProductCategoryDetailReq) returns (QueryProductCategoryDetailResp){}
  rpc QueryProductCategoryList(QueryProductCategoryListReq) returns (QueryProductCategoryListResp){}
  rpc QueryProductCategoryTreeList(QueryProductCategoryTreeListReq) returns(QueryProductCategoryListTreeResp);
}
