syntax = "proto3";

package main;

option go_package = "./proto";

message AddProductBrandReq {
  int64 id = 1;
  string name = 2;
  string logo = 3;
  string big_pic = 4;
  string description = 5;
  string first_letter = 6;
  int32 sort = 7;
  int32 recommend_status = 8;
  int32 product_count = 9;
  int32 product_comment_count = 10;
  int32 is_enabled = 11;
  int64 create_by = 12;
  GovernanceScope scope = 13;
}
message AddProductBrandResp { int64 brand_id = 1; }
message DeleteProductBrandReq { repeated int64 ids = 1; int64 update_by = 2; GovernanceScope scope = 3; }
message DeleteProductBrandResp { string pong = 1; }
message UpdateProductBrandReq {
  int64 id = 1;
  string name = 2;
  string logo = 3;
  string big_pic = 4;
  string description = 5;
  string first_letter = 6;
  int32 sort = 7;
  int32 recommend_status = 8;
  int32 product_count = 9;
  int32 product_comment_count = 10;
  int32 is_enabled = 11;
  int64 update_by = 14;
  GovernanceScope scope = 15;
}
message UpdateProductBrandResp { string pong = 1; }
message UpdateProductBrandStatusReq { repeated int64 ids = 1; int32 status = 2; int64 update_by = 3; GovernanceScope scope = 4; }
message UpdateProductBrandStatusResp { string pong = 1; }
message QueryProductBrandDetailReq { int64 id = 1; GovernanceScope scope = 2; }
message QueryProductBrandDetailResp {
  int64 id = 1;
  string name = 2;
  string logo = 3;
  string big_pic = 4;
  string description = 5;
  string first_letter = 6;
  int32 sort = 7;
  int32 recommend_status = 8;
  int32 product_count = 9;
  int32 product_comment_count = 10;
  int32 is_enabled = 11;
  int64 create_by = 12;
  string create_time = 13;
  int64 update_by = 14;
  string update_time = 15;
  string scope_type = 16;
  int64 platform_id = 17;
  int64 tenant_id = 18;
  int64 merchant_id = 19;
}
message QueryProductBrandListReq { string name = 1; int32 recommend_status = 2; int32 is_enabled = 3; int32 page_num = 4; int32 page_size = 5; GovernanceScope scope = 6; }
message ProductBrandListData {
  int64 id = 1;
  string name = 2;
  string logo = 3;
  string big_pic = 4;
  string description = 5;
  string first_letter = 6;
  int32 sort = 7;
  int32 recommend_status = 8;
  int32 product_count = 9;
  int32 product_comment_count = 10;
  int32 is_enabled = 11;
  int64 create_by = 12;
  string create_time = 13;
  int64 update_by = 14;
  string update_time = 15;
  string scope_type = 16;
  int64 platform_id = 17;
  int64 tenant_id = 18;
  int64 merchant_id = 19;
}
message QueryProductBrandListResp { int64 total = 1; repeated ProductBrandListData list = 2; }
message QueryBrandListByIdsReq { repeated int64 ids = 1; GovernanceScope scope = 2; }
message UpdateProductBrandSortReq { int64 id = 1; int32 sort  = 2; int64 update_by = 3; GovernanceScope scope = 4; }
service ProductBrandService {
  rpc AddProductBrand(AddProductBrandReq) returns (AddProductBrandResp){}
  rpc DeleteProductBrand(DeleteProductBrandReq) returns (DeleteProductBrandResp){}
  rpc UpdateProductBrand(UpdateProductBrandReq) returns (UpdateProductBrandResp ){}
  rpc UpdateProductBrandStatus(UpdateProductBrandStatusReq) returns (UpdateProductBrandStatusResp ){}
  rpc QueryProductBrandDetail(QueryProductBrandDetailReq) returns (QueryProductBrandDetailResp){}
  rpc QueryProductBrandList(QueryProductBrandListReq) returns (QueryProductBrandListResp){}
  rpc QueryBrandListByIds(QueryBrandListByIdsReq) returns(QueryProductBrandListResp);
  rpc UpdateBrandRecommendStatus(UpdateProductBrandStatusReq) returns(UpdateProductBrandStatusResp);
  rpc UpdateBrandSort(UpdateProductBrandSortReq) returns(UpdateProductBrandStatusResp);
}
