syntax = "proto3";

package main;

option go_package = "./proto";

message OrderItemData {
  int64 id = 1; //
  int64 order_id = 2; //订单ID
  string order_no = 3; //订单编号
  int32 order_item_status = 4; //订单商品状态：1-正常,2-退货申请中,3-已退货,4-已拒绝
  int64 sku_id = 5; //商品SKU ID
  string sku_name = 6; //商品名称
  string sku_pic = 7; //商品图片
  float sku_price = 8; //商品单价
  int32 sku_quantity = 9; //商品数量
  string spec_data = 10; //规格数据
  float sku_total_amount = 11; //商品总金额
  float promotion_amount = 12; //促销分摊金额
  float coupon_amount = 13; //优惠券分摊金额
  float points_amount = 14; //积分分摊金额
  float discount_amount = 15; //优惠分摊金额
  float real_amount = 16; //实付金额

}

// 添加订单
message AddOrderReq {
  int64 id = 1; //
  string order_no = 2; //订单编号
  int64 user_id = 3; //用户ID
  int32 order_status = 4; //订单状态：1-待支付,2-已支付,3-已发货,4-已完成,5-已取消,6-已退款,7-售后中
  float total_amount = 5; //订单总金额
  float promotion_amount = 6; //促销金额
  float coupon_amount = 7; //优惠券金额
  float points_amount = 8; //积分金额
  float discount_amount = 9; //优惠金额
  float freight_amount = 10; //运费金额
  float pay_amount = 11; //实付金额
  int32 source_type = 12; //订单来源：1-APP,2-PC,3-小程序
  int32 use_points = 13; //下单时使用的积分
  string remark = 14; //订单备注
  repeated OrderItemData order_item_data = 15; //订单商品
  string activity_type = 16; //活动类型(home_advertise/coupon/seckill_activity/none)
  int64 activity_id = 17; //活动ID
}

message AddOrderResp {
  int64 Id = 1;//订单创建成功后,返回订单id
}

// 删除订单
message DeleteOrderReq {
  repeated int64 ids = 1;
  int64 MemberId = 2;
  GovernanceScope scope = 3; //治理范围(platform/tenant/merchant)
}

message DeleteOrderResp {
  string pong = 1;
}

// 更新订单
message UpdateOrderReq {
  int64 id = 1; //
  int32 order_status = 2; //订单状态：1-待支付,2-已支付,3-已发货,4-已完成,5-已取消,6-已退款,7-售后中
  string express_order_number = 3; //快递单号
  string remark = 4; //订单备注
  float freight_amount = 5; //运费金额
  string order_no = 6; //订单编号
  float discount_amount = 7; //优惠金额
  GovernanceScope scope = 8; //治理范围(platform/tenant/merchant)
}

message UpdateOrderResp {
  string pong = 1;
}

// 更新订单状态
message UpdateOrderStatusReq {
  repeated int64 ids = 1; //
  int32 order_status = 4; //订单状态：1-待支付,2-已支付,3-已发货,4-已完成,5-已取消,6-已退款,7-售后中
  int32 receive_status = 20; //是否确认收货：0->否,1->是
}

message UpdateOrderStatusResp {
  string pong = 1;
}

// 查询订单详情
message QueryOrderDetailReq {
  int64 id = 1;
  int64 user_id = 2; //用户ID
  GovernanceScope scope = 3; //治理范围(platform/tenant/merchant)
}

message QueryOrderDetailResp {
  OrderListData data = 1; //订单详情


}

// 分页查询订单列表
message QueryOrderListReq {
  string order_no = 1; //订单编号
  int64 user_id = 2; //用户ID
  int32 order_status = 3; //订单状态：1-待支付,2-已支付,3-已发货,4-已完成,5-已取消,6-已退款,7-售后中
  int32 pay_type = 4; //支付方式：1-支付宝,2-微信,3-银联
  int32 source_type = 5; //订单来源：1-APP,2-PC,3-小程序
  string express_order_number = 6; //快递单号
  int32 page_num = 7; //第几页
  int32 page_size = 8; //每页的数量
  GovernanceScope scope = 9; //治理范围(platform/tenant/merchant)
}

message OrderOptLogData {
  int64 id = 1; //主键ID
  int64 order_id = 2; //订单ID
  string order_no = 3; //订单编号
  int32 operation_type = 4; //操作类型：1-创建订单，2-支付订单，3-发货，4-确认收货，5-取消订单，6-退款
  int64 operator_id = 5; //操作人ID
  int32 operator_type = 6; //操作人类型：1-用户，2-系统，3-管理员
  string operator_note = 7; //操作备注
  string create_time = 8; //操作时间

}
message PromotionListData {
  int64 id = 1; //主键ID
  int64 order_id = 2; //订单ID
  string order_no = 3; //订单编号
  int32 promotion_type = 4; //优惠类型：1-优惠券，2-积分抵扣，3-会员折扣，4-促销活动
  int64 promotion_id = 5; //优惠ID
  string promotion_name = 6; //优惠名称
  float discount_amount = 7; //优惠金额
  string create_time = 8; //

}
message DeliveryData {
  int64 id = 1; //
  int64 order_id = 2; //订单ID
  string order_no = 3; //订单编号
  string receiver_name = 4; //收货人姓名
  string receiver_phone = 5; //收货人电话
  string receiver_province = 6; //省份
  string receiver_city = 7; //城市
  string receiver_district = 8; //区县
  string receiver_address = 9; //详细地址
  string delivery_company = 10; //物流公司
  string delivery_no = 11; //物流单号
  string create_time = 12; //创建时间
  string update_time = 13; //更新时间
  int32 is_deleted = 14; //是否删除

}
message PaymentData {
  int64 id = 1; //主键ID
  int64 order_id = 2; //订单ID
  string order_no = 3; //订单编号
  int32 pay_type = 4; //支付方式：1-支付宝，2-微信，3-银联
  string transaction_id = 5; //支付流水号
  float total_amount = 6; //订单金额
  float pay_amount = 7; //支付金额
  int32 pay_status = 8; //支付状态：0-待支付，1-支付成功，2-支付失败
  string pay_time = 9; //支付时间
  string create_time = 10; //创建时间
  string update_time = 11; //

}
message OrderListData {
  int64 id = 1; //
  string order_no = 2; //订单编号
  int64 user_id = 3; //用户ID
  int32 order_status = 4; //订单状态：1-待支付,2-已支付,3-已发货,4-已完成,5-已取消,6-已退款,7-售后中
  float total_amount = 5; //订单总金额
  float promotion_amount = 6; //促销金额
  float coupon_amount = 7; //优惠券金额
  float points_amount = 8; //积分金额
  float discount_amount = 9; //优惠金额
  float freight_amount = 10; //运费金额
  float pay_amount = 11; //实付金额
  int32 pay_type = 12; //支付方式：1-支付宝,2-微信,3-银联
  string pay_time = 13; //支付时间
  string delivery_time = 14; //发货时间
  string receive_time = 15; //收货时间
  string comment_time = 16; //评价时间
  int32 source_type = 17; //订单来源：1-APP,2-PC,3-小程序
  string express_order_number = 18; //快递单号
  int32 use_points = 19; //下单时使用的积分
  int32 receive_status = 20; //是否确认收货：0->否,1->是
  string remark = 21; //订单备注
  string create_time = 22; //提交时间
  string update_time = 23; //
  repeated OrderItemData order_item_data = 24; //订单商品
  repeated OrderOptLogData opt_log_data = 25; //订单操作记录
  repeated PromotionListData promotion_data = 26; //订单优惠信息
  repeated PaymentData payment_data = 27; //订单支付信息
  DeliveryData delivery_data = 28; //订单收货地址
  string activity_type = 29; //活动类型(home_advertise/coupon/seckill_activity/none)
  int64 activity_id = 30; //活动ID
  int32 retry_count = 31; //补偿重试次数
  int32 paused = 32; //是否暂停
}

message OperateOrderBucketPoint {
  string bucket_label = 1; //时间桶标签
  string bucket_start = 2; //时间桶开始(闭区间)
  string bucket_end = 3; //时间桶结束(开区间)
  int64 order_created = 4; //下单数
  int64 pay_success = 5; //支付成功数
}

message QueryOperateOrderFunnelReq {
  GovernanceScope scope = 1; //治理范围(platform/tenant/merchant)
  string start_time = 2; //开始时间，按 Asia/Shanghai 解析
  string end_time = 3; //结束时间，按 Asia/Shanghai 解析
  string channel = 4; //统一渠道(app/pc/h5/mini_program/unknown)
  string activity_type = 5; //活动类型(home_advertise/coupon/seckill_activity/none)
  int64 activity_id = 6; //活动ID
  string bucket = 7; //时间桶(day/hour)
}

message QueryOperateOrderFunnelResp {
  repeated OperateOrderBucketPoint buckets = 1;
  int64 total_order_created = 2; //下单总量
  int64 total_pay_success = 3; //支付成功总量
  string tracking_started_at = 4; //埋点可信起点
  repeated string partial_metrics = 5; //部分可用指标
}

enum ChainType {
  CHAIN_TYPE_UNKNOWN = 0;
  CHAIN_TYPE_COMPENSATION = 1;
}

message ChainMonitorItem {
  string trace_id = 1; //链路追踪ID
  int64 platform_id = 2; //平台ID
  int64 tenant_id = 3; //租户ID
  int64 merchant_id = 4; //商户ID
  int32 chain_type = 5; //链路类型
  string chain_type_text = 6; //链路类型文本
  int64 entity_id = 7; //业务对象ID
  string entity_no = 8; //业务编号
  int32 entity_type = 9; //业务对象类型
  int32 stage = 10; //一致性阶段
  string stage_text = 11; //阶段文本
  int32 result = 12; //处理结果
  string result_text = 13; //结果文本
  int32 retry_count = 14; //重试次数
  string last_error = 15; //最近错误
  string last_execute_at = 16; //最近执行时间
  string created_at = 17; //创建时间
  int64 actor_id = 18; //触发操作人
  int32 paused = 19; //是否暂停
  string pause_reason = 20; //暂停原因
}

message QueryCompensationChainListReq {
  int32 page_num = 1; //第几页
  int32 page_size = 2; //每页的数量
  int32 chain_type = 3; //链路类型
  int32 consistency_stage = 4; //一致性阶段
  int32 consistency_result = 5; //一致性结果
  int32 manual_required = 6; //是否需人工介入：0-全部,1-是,2-否
  string start_time = 7; //开始时间
  string end_time = 8; //结束时间
  string order_no = 9; //订单编号
  GovernanceScope scope = 10; //治理范围(platform/tenant/merchant)
}

message QueryCompensationChainListResp {
  int64 total = 1;
  repeated ChainMonitorItem list = 2;
}

message QueryChainActionsReq {
  int64 order_id = 1; //订单ID
  int64 platform_id = 2; //平台ID
  int64 tenant_id = 3; //租户ID
  int64 merchant_id = 4; //商户ID
}

message QueryChainActionsResp {
  int64 code = 1;
  string msg = 2;
  repeated string available_actions = 3;
}

message RetryCompensationChainReq {
  int64 order_id = 1; //订单ID
  string remark = 2; //备注
  int64 operator_id = 3; //操作人ID
  int64 platform_id = 4; //平台ID
  int64 tenant_id = 5; //租户ID
  int64 merchant_id = 6; //商户ID
}

message RetryCompensationChainResp {
  int64 code = 1;
  string msg = 2;
  int64 new_retry_count = 3; //最新重试次数
  string trace_id = 4; //追踪ID
  int32 before_stage = 5; //操作前阶段
  int32 before_result = 6; //操作前结果
  int32 after_stage = 7; //操作后阶段
  int32 after_result = 8; //操作后结果
}

message ReplayCompensationChainReq {
  int64 order_id = 1; //订单ID
  string replay_reason = 2; //回放原因
  int64 operator_id = 3; //操作人ID
  int64 platform_id = 4; //平台ID
  int64 tenant_id = 5; //租户ID
  int64 merchant_id = 6; //商户ID
}

message ReplayCompensationChainResp {
  int64 code = 1;
  string msg = 2;
  string trace_id = 3; //追踪ID
  int32 before_stage = 4; //操作前阶段
  int32 before_result = 5; //操作前结果
  int32 after_stage = 6; //操作后阶段
  int32 after_result = 7; //操作后结果
}

message PauseCompensationChainReq {
  int64 order_id = 1; //订单ID
  string pause_reason = 2; //暂停原因
  int64 operator_id = 3; //操作人ID
  int64 platform_id = 4; //平台ID
  int64 tenant_id = 5; //租户ID
  int64 merchant_id = 6; //商户ID
}

message PauseCompensationChainResp {
  int64 code = 1;
  string msg = 2;
  bool paused = 3; //是否已暂停
  int32 before_stage = 4; //操作前阶段
  int32 before_result = 5; //操作前结果
  int32 after_stage = 6; //操作后阶段
  int32 after_result = 7; //操作后结果
}

message EscalateChainReq {
  int64 order_id = 1; //订单ID
  string escalate_reason = 2; //升级原因
  int64 operator_id = 3; //操作人ID
  int64 platform_id = 4; //平台ID
  int64 tenant_id = 5; //租户ID
  int64 merchant_id = 6; //商户ID
}

message EscalateChainResp {
  int64 code = 1;
  string msg = 2;
  bool manual_required = 3; //是否需人工介入
  int32 before_stage = 4; //操作前阶段
  int32 before_result = 5; //操作前结果
  int32 after_stage = 6; //操作后阶段
  int32 after_result = 7; //操作后结果
}

message QueryOrderListResp {
  int64 total = 1;
  repeated  OrderListData list = 2;
}

message DeliveryReq {
  int64 order_id = 1;//订单id
  string delivery_sn = 2;//物流单号
  int64 OperatorId = 3;
  string OrderNo = 4;
  GovernanceScope scope = 5; //治理范围(platform/tenant/merchant)
}

message DeliveryResp {
  string pong = 1;
}
message CloseOrderReq {
  repeated int64 Ids = 1;
  string Note = 2;
  int64 OperatorId = 3;
  string OrderNo = 4;
  GovernanceScope scope = 5; //治理范围(platform/tenant/merchant)
}

message CloseOrderResp {
  string pong = 1;
}

message UpdateReceiverInfoResp {
  string pong = 1;
}
message CancelOrderReq {
  int64 MemberId = 1;
  int64 OrderId = 2;
  string Source = 3; //取消来源：user-用户主动取消,timeout-超时自动关闭
}

message ReleaseSkuStockLockData {
  int64    ProductSkuId = 1;
  int32    ProductQuantity = 2;
}

message CancelOrderResp {
  repeated int64 CouponIds = 1;//优惠券id集合
  int32 Integration = 2;//积分
  repeated ReleaseSkuStockLockData data = 3;//释放库存
}
message ConfirmOrderReq {
  int64 MemberId = 1;
  int64 OrderId = 2;
}

message ConfirmOrderResp {
  string pong = 1;
}
message QueryTimeOutOrderListReq {
  int32 minute = 1; //超时的时间

}

// 更新订单一致性阶段
message UpdateOrderConsistencyReq {
  int64 order_id = 1; //订单ID
  int32 consistency_stage = 2; //一致性阶段：0-无阶段,4-取消回退中,5-取消回退完成
  int32 consistency_result = 3; //一致性结果：0-无结果,1-处理中,2-成功,3-失败,4-需要人工介入
  string last_error = 4; //最近错误摘要
  int32 retry_count = 5; //重试次数
  int64 actor_id = 6; //操作者ID
}

message UpdateOrderConsistencyResp {
  string pong = 1;
}

// 查询需要人工介入的补偿订单
message QueryManualRequiredOrdersReq {
  int32 page_num = 1; //第几页
  int32 page_size = 2; //每页的数量
  GovernanceScope scope = 3; //治理范围(platform/tenant/merchant)
}

message QueryManualRequiredOrdersResp {
  int64 total = 1;
  repeated OrderListData list = 2;
}

// 订单
service OrderService {
  // 添加订单(app)
  rpc AddOrder(AddOrderReq) returns (AddOrderResp){}
  // 删除订单
  rpc DeleteOrder(DeleteOrderReq) returns (DeleteOrderResp){}
  // 更新订单
  rpc UpdateOrder(UpdateOrderReq) returns (UpdateOrderResp){}
  // 更新订单状态
  rpc UpdateOrderStatus(UpdateOrderStatusReq) returns (UpdateOrderStatusResp){}
  // 查询订单详情:订单信息、商品信息、操作记录
  rpc QueryOrderDetail(QueryOrderDetailReq) returns (QueryOrderDetailResp){}
  // 查询订单列表
  rpc QueryOrderList(QueryOrderListReq) returns (QueryOrderListResp){}
  // 查询经营漏斗订单聚合
  rpc QueryOperateOrderFunnel(QueryOperateOrderFunnelReq) returns (QueryOperateOrderFunnelResp){}
  // 查询链路监控列表
  rpc QueryCompensationChainList(QueryCompensationChainListReq) returns (QueryCompensationChainListResp){}
  // 查询可用干预动作
  rpc QueryChainActions(QueryChainActionsReq) returns (QueryChainActionsResp){}
  // 重试补偿链路
  rpc RetryCompensationChain(RetryCompensationChainReq) returns (RetryCompensationChainResp){}
  // 回放补偿链路
  rpc ReplayCompensationChain(ReplayCompensationChainReq) returns (ReplayCompensationChainResp){}
  // 暂停补偿链路
  rpc PauseCompensationChain(PauseCompensationChainReq) returns (PauseCompensationChainResp){}
  // 升级为人工介入
  rpc EscalateChain(EscalateChainReq) returns (EscalateChainResp){}

  //订单发货
  rpc Delivery(DeliveryReq) returns(DeliveryResp);
  //关闭订单
  rpc CloseOrder(CloseOrderReq) returns(CloseOrderResp);

  //取消订单(app)
  rpc CancelOrder(CancelOrderReq) returns(CancelOrderResp);
  //确认收货(app)
  rpc ConfirmOrder(ConfirmOrderReq) returns(ConfirmOrderResp);

  //查询超时、未支付的订单及订单详情
  rpc QueryTimeOutOrderList(QueryTimeOutOrderListReq) returns(QueryOrderListResp);

  //更新订单一致性阶段（用于补偿链路）
  rpc UpdateOrderConsistency(UpdateOrderConsistencyReq) returns(UpdateOrderConsistencyResp);

  //查询需要人工介入的补偿订单
  rpc QueryManualRequiredOrders(QueryManualRequiredOrdersReq) returns(QueryManualRequiredOrdersResp);
}
