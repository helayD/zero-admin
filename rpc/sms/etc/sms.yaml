Name: sms.rpc
ListenOn: 0.0.0.0:8084
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: sms.rpc

Mysql:
  Datasource: root:12341qweqfsd2356@tcp(127.0.0.1:3306)/gozero?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

Rabbitmq:
  Host: 127.0.0.1
  Port: 5672
  UserName: guest
  Password: guest

AntChain:
  Endpoint: ""
  ReceiptEndpoint: ""
  AppId: ""
  AccessKey: ""
  Secret: ""
  TimeoutSeconds: 10
  Enabled: false

Blockchain:
  Primary: fisco

# Story 10.11: FISCO BCOS 3.x 真实上链配置
# 节点部署在 47.107.224.56:20200-20203。生产环境 Enabled 默认 false，灰度跳闸时手动置 true。
Fisco:
  Enabled: false
  Host: ""                  # 例如 47.107.224.56。空字符 + Enabled=true 会被 Validate 拦下
  Port: 0                   # 例如 20200
  DisableSsl: false         # 生产必须 false，启用 mTLS
  IsSMCrypto: false
  GroupID: "group0"
  ChainID: "chain0"
  ContractAddr: ""          # 部署后填入：0x6849f21d1e455e9f0712b1e99fa4fcd23758e8f1
  ContractABI: ""           # 与 ContractABIPath 二选一
  ContractABIPath: "/opt/fisco/contracts/CardToken.abi"
  PrivateKey: ""            # 例如 path:///opt/fisco/keys/sms-rpc.key
  CaCertPath: "/opt/fisco/sdk/ca.crt"
  SdkCertPath: "/opt/fisco/sdk/sdk.crt"
  SdkKeyPath: "/opt/fisco/sdk/sdk.key"
  TimeoutSeconds: 30        # SDK SendEncodedTransaction 内部已同步轮询 receipt，本字段仅作整体超时保护

Log:
  ServiceName: sms-service
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Path: logs/sms
Prometheus:
  Host: 127.0.0.1
  Port: 8184
  Path: /metrics
