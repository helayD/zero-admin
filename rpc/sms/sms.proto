message QueryMemberCouponListReq {
  int64 memberId = 1;
  int32  Status = 2;
}
message QueryCouponData {
  int64 id = 1; //优惠券ID
  int64 type_id = 2; //优惠券类型ID
  string name = 3; //优惠券名称
