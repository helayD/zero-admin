Name: front-api
Host: 0.0.0.0
Port: 9999

#系统 - 直连模式绕过 etcd
SysRpc:
  Endpoints:
    - 127.0.0.1:8070
  NonBlock: true

#会员
UmsRpc:
  Endpoints:
    - 127.0.0.1:8081
  NonBlock: true

#商品
PmsRpc:
  Endpoints:
    - 127.0.0.1:8082
  NonBlock: true

#订单
OmsRpc:
  Endpoints:
    - 127.0.0.1:8083
  NonBlock: true

#营销
SmsRpc:
  Endpoints:
    - 127.0.0.1:8084
  NonBlock: true

#支付
PayRpc:
  Etcd:
    Hosts:
      - localhost:2379
    Key: pay.rpc
  NonBlock: true

#内容相关
CmsRpc:
  Endpoints:
    - 127.0.0.1:8086
  NonBlock: true

#搜索
SearchRpc:
  Endpoints:
    - 127.0.0.1:8088
  NonBlock: true

Log:
  ServiceName: front-api
  Stat: false # go-zero 版本 >= 1.5.0 才支持
  Mode: file
  Path: logs/front
Prometheus:
  Host: 127.0.0.1
  Port: 9199
  Path: /metrics

Auth:
  AccessSecret: ad879037-c7a4-4063-9236-6bfc35d54b7d
  AccessExpire: 86400

#支付宝支付配置
Alipay:
  AppId: "2021003185602111"    #支付宝应用 id
  PrivateKey: "123456"         #应用私钥，开发者自己生成
  ServerDomain: ""           #设置回调地址域名
  NotifyURL: ""              #异步回调
  IsProduction: true         #是否为生产环境，传 false 的时候为沙箱环境，用于开发测试，正式上线的时候需要改为 true

# swagger
Swagger:
  IsTest: true #是否打开swagger，true为打开，false为关闭（生产环境需要关闭）
  Path: "api/front/static"

Rabbitmq:
  Host: 127.0.0.1
  Port: 5672
  UserName: guest
  Password: guest

Redis:
  Address: 127.0.0.1:6379
  Pass: "123456"

Mysql:
  Datasource: root:12341qweqfsd2356@tcp(127.0.0.1:3306)/gozero?charset=utf8mb4&parseTime=true&loc=Asia%2FShanghai

Share:
  AllowedDomains:
    # Story 10.7 Review Fix: 首项作为客户端未传 domain 时的兜底域名，用于拼接分享链接
    # 当前部署在 47.107.224.56:9999（front-api 直出 /h5/digital-card/claim）
    - 47.107.224.56:9999
    - example.com
    - mall.example.com
    # 生产环境请在配置中心或环境变量中注入真实域名

UpgradePolicy:
  CurrentVersion: "1.0.0"
  MinSupportedVersion: "1.0.0"
  RecommendedVersion: ""
  EffectiveAt: ""
  DeadlineAt: ""
  ReleaseNotesSummary: ""
  UpgradeUrl: ""
  StoreTarget: ""
  RecoveryHint: ""
  AffectedCapabilities: []
